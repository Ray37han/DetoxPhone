# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# NOTE: JDK 21 required — Kotlin 2.2.21 does not support JDK 26's JavaVersion format.
# Update this path if your JDK 21 is installed elsewhere.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official

# Enables AndroidX
android.useAndroidX=true

# Non-transitive R classes reduce compile time
android.nonTransitiveRClass=true

# Parallel Gradle execution
org.gradle.parallel=true

# Build caching
org.gradle.caching=true

# Configuration cache (stable in Gradle 8.x)
org.gradle.configuration-cache=true

# Fix KT-80785: Disable AGP 9 new DSL and built-in Kotlin for KSP & Kotlin-Android plugin compatibility
android.builtInKotlin=false
android.newDsl=false

