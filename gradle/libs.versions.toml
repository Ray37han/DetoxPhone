[versions]
agp                  = "9.4.1"
kotlin               = "2.2.21"
# KSP version must match Kotlin version: https://github.com/google/ksp/releases
ksp                  = "2.2.21-2.0.5"

# Android SDK
compile-sdk          = "37"
min-sdk              = "26"
target-sdk           = "37"

# Jetpack
compose-bom          = "2026.08.00"
activity-compose     = "1.10.1"
navigation-compose   = "2.10.1"
hilt                 = "2.60.1"
hilt-navigation      = "1.2.0"
room                 = "2.8.5"
datastore            = "1.2.1"
lifecycle            = "2.9.1"
core-ktx             = "1.15.0"
workmanager          = "2.10.1"

# Kotlin
coroutines           = "1.9.0"
serialization        = "1.7.3"

# Testing
junit4               = "4.13.2"
androidx-test-ext    = "1.2.1"
espresso             = "3.6.1"
truth                = "1.4.4"

[libraries]
# ── Compose BOM ────────────────────────────────────────────────────────────────
compose-bom                  = { group = "androidx.compose",        name = "compose-bom",              version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui",     name = "ui-graphics" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-ui-tooling           = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-ui-test-junit4       = { group = "androidx.compose.ui",     name = "ui-test-junit4" }
compose-ui-test-manifest     = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons       = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-activity             = { group = "androidx.activity",       name = "activity-compose",         version.ref = "activity-compose" }

# ── Navigation ─────────────────────────────────────────────────────────────────
navigation-compose           = { group = "androidx.navigation",     name = "navigation-compose",       version.ref = "navigation-compose" }

# ── Hilt ───────────────────────────────────────────────────────────────────────
hilt-android                 = { group = "com.google.dagger",       name = "hilt-android",             version.ref = "hilt" }
hilt-android-compiler        = { group = "com.google.dagger",       name = "hilt-android-compiler",    version.ref = "hilt" }
hilt-navigation-compose      = { group = "androidx.hilt",           name = "hilt-navigation-compose",  version.ref = "hilt-navigation" }
hilt-android-testing         = { group = "com.google.dagger",       name = "hilt-android-testing",     version.ref = "hilt" }
hilt-android-testing-compiler = { group = "com.google.dagger",      name = "hilt-android-compiler",    version.ref = "hilt" }

# ── Room ───────────────────────────────────────────────────────────────────────
room-runtime                 = { group = "androidx.room",           name = "room-runtime",             version.ref = "room" }
room-ktx                     = { group = "androidx.room",           name = "room-ktx",                 version.ref = "room" }
room-compiler                = { group = "androidx.room",           name = "room-compiler",            version.ref = "room" }
room-testing                 = { group = "androidx.room",           name = "room-testing",             version.ref = "room" }

# ── DataStore ──────────────────────────────────────────────────────────────────
datastore-preferences        = { group = "androidx.datastore",      name = "datastore-preferences",    version.ref = "datastore" }

# ── WorkManager ────────────────────────────────────────────────────────────────────────────────
work-runtime-ktx             = { group = "androidx.work",           name = "work-runtime-ktx",         version.ref = "workmanager" }
hilt-work                    = { group = "androidx.hilt",           name = "hilt-work",                version = "1.2.0" }
hilt-work-compiler           = { group = "androidx.hilt",           name = "hilt-compiler",            version = "1.2.0" }

# ── Lifecycle ──────────────────────────────────────────────────────────────────
lifecycle-viewmodel-ktx      = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-ktx",  version.ref = "lifecycle" }
lifecycle-viewmodel-compose  = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx        = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",    version.ref = "lifecycle" }

# ── Core ───────────────────────────────────────────────────────────────────────
core-ktx                     = { group = "androidx.core",           name = "core-ktx",                 version.ref = "core-ktx" }

# ── Coroutines ─────────────────────────────────────────────────────────────────
coroutines-android           = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test              = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test",    version.ref = "coroutines" }
serialization-json            = { group = "org.jetbrains.kotlinx",   name = "kotlinx-serialization-json", version.ref = "serialization" }

# ── Testing ────────────────────────────────────────────────────────────────────
junit4                       = { group = "junit",                   name = "junit",                    version.ref = "junit4" }
androidx-test-ext-junit      = { group = "androidx.test.ext",       name = "junit",                    version.ref = "androidx-test-ext" }
espresso-core                = { group = "androidx.test.espresso",  name = "espresso-core",            version.ref = "espresso" }
truth                        = { group = "com.google.truth",        name = "truth",                    version.ref = "truth" }

[plugins]
android-application  = { id = "com.android.application",               version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",         version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",                version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
